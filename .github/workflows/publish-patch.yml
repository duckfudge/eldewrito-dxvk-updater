name: Publish patch feed
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-dxvk-patch-feed
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate and publish current public patch
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/publish_patch.py --dry-run
          else
            python scripts/publish_patch.py
          fi
